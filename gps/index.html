<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastreador GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #panel{position:absolute;z-index:1000;top:10px;left:10px;right:10px;max-width:320px;
    background:rgba(255,255,255,.95);border-radius:12px;padding:12px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.3);font-size:14px;line-height:1.5;color:#111}
  #estado{font-weight:700}
  .ok{color:#1a8a3a}.mal{color:#c0392b}
  button{margin-top:6px;padding:6px 10px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:13px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="estado" class="mal">Conectando...</div>
  <div id="datos"></div>
  <button onclick="centrar=true;">Seguir</button>
  <button onclick="ruta.setLatLngs([])">Ocultar recorrido</button>
</div>
<script>
const map = L.map('map').setView([-25.2637,-57.5759], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; OpenStreetMap'
}).addTo(map);

let marcador=null, centrar=true, primera=true;
const ruta=L.polyline([],{color:'#2563eb',weight:4}).addTo(map);
map.on('dragstart',()=>centrar=false);

async function cargarHistorial(){
  try{
    const h=await (await fetch('/api/history',{cache:'no-store'})).json();
    ruta.setLatLngs(h);
  }catch(e){}
}

async function actualizar(){
  const est=document.getElementById('estado'), dat=document.getElementById('datos');
  try{
    const d=await (await fetch('/api/location',{cache:'no-store'})).json();
    if(!d.valid){
      est.textContent='Esperando datos del GPS...'; est.className='mal';
      dat.innerHTML='Todavía no llegó ninguna posición.';
      return;
    }
    const p=[d.lat,d.lng];
    const seg=Math.round(d.ageMs/1000);
    const viejo=seg>30;
    est.textContent = viejo ? 'Sin señal hace '+seg+' s (última posición)' : 'GPS en vivo';
    est.className = viejo ? 'mal' : 'ok';
    dat.innerHTML='Lat: '+d.lat.toFixed(6)+'<br>Lng: '+d.lng.toFixed(6)+
      '<br>Velocidad: '+d.speed.toFixed(1)+' km/h'+
      '<br>Altitud: '+d.alt.toFixed(0)+' m'+
      '<br>Satélites: '+d.sats+' | HDOP: '+d.hdop.toFixed(1)+
      '<br>Actualizado hace '+seg+' s'+
      '<br><a target="_blank" href="https://www.google.com/maps?q='+d.lat+','+d.lng+'">Abrir en Google Maps</a>';
    if(!marcador) marcador=L.marker(p).addTo(map); else marcador.setLatLng(p);
    const pts=ruta.getLatLngs();
    if(!pts.length || map.distance(pts[pts.length-1],p)>3) ruta.addLatLng(p);
    if(primera){ map.setView(p,17); primera=false; }
    else if(centrar) map.panTo(p);
  }catch(e){
    est.textContent='Sin conexión con el servidor'; est.className='mal';
  }
}
cargarHistorial().then(actualizar);
setInterval(actualizar,3000);
</script>
</body>
</html>
